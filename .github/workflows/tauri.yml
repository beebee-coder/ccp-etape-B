name: Tauri CI

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**.md"
      - "**.txt"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  tauri-check-linux:
    name: Tauri Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "x86_64-unknown-linux-gnu"
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libglib2.0-dev libappindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Build Next.js frontend
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          NEXT_PUBLIC_API_URL: ""
          SKIP_ENV_VALIDATION: "true"
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Build Tauri app
        run: tauri build
        working-directory: .

  tauri-check-windows:
    name: Tauri Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Build Next.js frontend
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          NEXT_PUBLIC_API_URL: ""
          SKIP_ENV_VALIDATION: "true"
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Build Tauri app (Windows)
        run: tauri build -- --bundles msi nsis
        working-directory: .
        env:
          npm_config_msvs_version: 2022

  tauri-test:
    name: Tauri Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "x86_64-unknown-linux-gnu"
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libglib2.0-dev libappindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Build Next.js frontend
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          NEXT_PUBLIC_API_URL: ""
          SKIP_ENV_VALIDATION: "true"
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2
      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri


