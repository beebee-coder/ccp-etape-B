name: Tauri CI

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "**.json"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  tauri-check-linux:
    name: Tauri Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "x86_64-unknown-linux-gnu"
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libglib2.0-dev libappindicator3-dev librsvg2-dev patchelf pkg-config
      - run: npm ci --ignore-scripts
      - run: npm install -g @tauri-apps/cli@2
      - run: npm run tauri build -- --bundles none
        working-directory: src-tauri

  tauri-check-windows:
    name: Tauri Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: npm install -g @tauri-apps/cli@2
      - run: npm run tauri build -- --bundles none
        working-directory: src-tauri
        env:
          npm_config_msvs_version: 2022

  tauri-test:
    name: Tauri Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "x86_64-unknown-linux-gnu"
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libglib2.0-dev libappindicator3-dev librsvg2-dev patchelf pkg-config
      - run: npm ci --ignore-scripts
      - run: npm install -g @tauri-apps/cli@2
      - run: cargo test
        working-directory: src-tauri
